name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Fiktive credentials — kun til test i CI.
          POSTGRES_USER: ea
          POSTGRES_PASSWORD: ea
          POSTGRES_DB: ea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ea"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EA_TEST_CONNECTION: Host=localhost;Username=ea;Password=ea;Database=postgres
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore EA.slnx && dotnet tool restore
      - name: Format
        run: dotnet format EA.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build EA.slnx -c Release --no-restore
      - name: Test
        run: dotnet test --solution EA.slnx -c Release --no-build
      - name: Migrationer matcher modellen
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: dotnet ef migrations has-pending-model-changes --project src/Ea.Api --configuration Release --no-build

  web:
    name: Web (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Genererede typer matcher API-kontrakten
        run: npm run gen:api && git diff --exit-code -- src/api

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Fiktive credentials — kun til test i CI.
          POSTGRES_USER: ea
          POSTGRES_PASSWORD: ea
          POSTGRES_DB: ea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ea"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Browser
        run: npx playwright install --with-deps chromium
      # Bygges før testene, så API'ets opstart (e2e/start-api.sh) ikke bruger webServer-tidsgrænsen på at bygge.
      - name: Byg API'et
        run: dotnet build ../src/Ea.Api
      - name: E2E
        run: npm run e2e
      - name: Rapport og spor ved fejl
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rapport
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
