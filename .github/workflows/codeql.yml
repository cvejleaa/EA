name: CodeQL

# Statisk sikkerhedsanalyse af API'et (C#) og klienten (TypeScript): sporer brugerinput frem til SQL,
# kommandoer, stier, logning m.m. Fund vises under Security → Code scanning og som et tjek på PR'en.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # Mandag: nye regler i CodeQL rammer også kode, der ikke er ændret.

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Uden build: C# analyseres direkte fra kilden, så .NET-versionen på runneren er ligegyldig.
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
